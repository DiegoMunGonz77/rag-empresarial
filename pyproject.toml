[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-empresarial"
version = "0.1.0"
description = "Asistente RAG empresarial sobre documentos PDF, DOCX y TXT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "google-genai>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.35",
    "requests>=2.31",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
